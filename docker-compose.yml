version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - wordpress_data:/var/www/html
    depends_on:
      - php
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: php
    restart: unless-stopped
    volumes:
      - wordpress_data:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_TABLE_PREFIX=${TABLE_PREFIX}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mariadb
      - redis
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "php-fpm", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  wpcli:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: wpcli
    restart: "no"
    entrypoint: [ "wp" ]
    command: [ "--info" ]
    volumes:
      - wordpress_data:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_TABLE_PREFIX=${TABLE_PREFIX}
    depends_on:
      - mariadb
    networks:
      - wp_network
    profiles:
      - tools

  mariadb-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mariadb-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${DB_USER}:${DB_PASSWORD}@tcp(mariadb:3306)/
    networks:
      - wp_network
      - monitoring_net
    depends_on:
      - mariadb

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://nginx:80/stub_status'
    networks:
      - wp_network
      - monitoring_net
    depends_on:
      - nginx

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - wp_network
      - monitoring_net
    depends_on:
      - redis

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:2.1.0
    container_name: php-fpm-exporter
    restart: unless-stopped
    environment:
      - PHP_FPM_SCRAPE_URI=tcp://php:9000/status
    networks:
      - wp_network
      - monitoring_net
    depends_on:
      - php

volumes:
  wordpress_data:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  wp_network:
    driver: bridge
  monitoring_net:
    external: true
