version: "3.9"

services:
  # ──────────────────────────────────────────────
  # NGINX – Reverse Proxy & Servidor Web
  # ──────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: wp_nginx
    restart: unless-stopped
    volumes:
      - wp_data:/var/www/html
      - nginx_logs:/var/log/nginx
    depends_on:
      php:
        condition: service_healthy
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wp.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.wp.entrypoints=websecure"
      - "traefik.http.routers.wp.tls.certresolver=letsencrypt"
      - "traefik.http.services.wp.loadbalancer.server.port=80"

  # ──────────────────────────────────────────────
  # PHP-FPM – Motor de WordPress
  # ──────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    container_name: wp_php
    restart: unless-stopped
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', '${REDIS_PASSWORD}');
        define('WP_REDIS_DATABASE', 0);
        define('WP_CACHE', true);
        define('DISABLE_WP_CRON', true);
        define('WP_MEMORY_LIMIT', '1024M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────────────
  # WP-CLI – Herramienta de línea de comandos
  # ──────────────────────────────────────────────
  wpcli:
    build:
      context: .
      dockerfile: Dockerfile.php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    container_name: wp_cli
    restart: "no"
    entrypoint: [ "wp" ]
    command: [ "--info" ]
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - wp_network
    profiles:
      - tools

  # ──────────────────────────────────────────────
  # MariaDB 11 – Base de Datos
  # ──────────────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: wp_mariadb
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # Redis 7 – Object Cache & Sesiones
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wp_redis
    restart: unless-stopped
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  wp_network:
    driver: bridge

volumes:
  wp_data:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
