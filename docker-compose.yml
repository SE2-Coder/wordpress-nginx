version: "3.9"

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    volumes:
      - wp_data:/var/www/html
      - nginx_logs:/var/log/nginx
    depends_on:
      php:
        condition: service_healthy
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Nombre de router ÚNICO para Traefik.
      # Define ROUTER_NAME en tu .env de Coolify (ej. ROUTER_NAME=sitio1, ROUTER_NAME=sitio2)
      - "traefik.http.routers.${ROUTER_NAME:-wp_default}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME:-wp_default}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_NAME:-wp_default}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${ROUTER_NAME:-wp_default}.loadbalancer.server.port=80"

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    restart: unless-stopped
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', '${REDIS_PASSWORD}');
        define('WP_REDIS_DATABASE', ${REDIS_DB:-0});
        define('WP_CACHE', true);
        define('DISABLE_WP_CRON', true);
        define('WP_MEMORY_LIMIT', '1024M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        define('COOKIEHASH', md5('${DOMAIN}'));
        define('COOKIE_DOMAIN', '${DOMAIN}');
        if (php_sapi_name() !== 'cli') {
            @ini_set('session.name', 'PHPSESSID_' . md5('${DOMAIN}'));
        }
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  wpcli:
    build:
      context: .
      dockerfile: Dockerfile.php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    restart: "no"
    entrypoint: [ "wp" ]
    command: [ "--info" ]
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - wp_network
    profiles:
      - tools

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wp_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  wp_network:
    driver: bridge

volumes:
  wp_data:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
