server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    # ─── SOPORTE PARA UPLOADS DE 1GB ───
    client_max_body_size 1024M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # ─── Cabeceras de Seguridad ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-FastCGI-Cache $upstream_cache_status;

    # ─── REGLAS DE BYPASS DE CACHÉ ───
    set $skip_cache 0;

    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml") {
        set $skip_cache 1;
    }

    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    if ($args ~* "s=|preview=true") {
        set $skip_cache 1;
    }

    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # ─── WordPress Permalinks ───
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ─── PHP-FPM con FastCGI Cache ───
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # ═══ FASTCGI CACHE CONFIG ═══
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 60m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        
        fastcgi_buffer_size 128k;
        fastcgi_buffers 16 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ─── Caché de Activos Estáticos (1 año) ───
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Seguridad: Bloqueo de archivos sensibles ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}