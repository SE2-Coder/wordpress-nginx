server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    # ─── SOPORTE PARA UPLOADS DE 1GB ───
    client_max_body_size 1024M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # ─── Cabeceras de Seguridad ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Header informativo de caché (útil para debug)
    add_header X-FastCGI-Cache $upstream_cache_status;

    # ─── REGLAS DE BYPASS DE CACHÉ ───
    # Decidir cuándo NO cachear
    set $skip_cache 0;

    # No cachear wp-admin, wp-login, feeds, sitemap, XML-RPC
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml") {
        set $skip_cache 1;
    }

    # No cachear si el usuario está logueado o comentó recientemente
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    # No cachear búsquedas ni queries con parámetros
    if ($args ~* "s=|preview=true") {
        set $skip_cache 1;
    }

    # No cachear métodos POST (formularios)
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # ─── WordPress Permalinks ───
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ─── PHP-FPM con FastCGI Cache ───
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # ═══ FASTCGI CACHE CONFIG ═══
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 60m;      # Páginas OK: 60 minutos
        fastcgi_cache_valid 404 1m;       # 404: 1 minuto
        fastcgi_cache_bypass $skip_cache; # Si skip_cache=1, no usar caché
        fastcgi_no_cache $skip_cache;     # Si skip_cache=1, no guardar en caché
        
        # Buffers grandes para evitar errores 502
        fastcgi_buffer_size 128k;
        fastcgi_buffers 16 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Timeouts extendidos
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        # Pasar información del proxy
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ─── PURGA DE CACHÉ (para plugin Nginx Helper) ───
    location ~ /purge(/.*) {
        fastcgi_cache_purge WORDPRESS "$scheme$request_method$host$1";
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ─── Caché de Activos Estáticos (1 año) ───
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Seguridad: Bloqueo de archivos sensibles ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}