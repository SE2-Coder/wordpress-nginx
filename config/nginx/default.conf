server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    # ─── SOPORTE PARA UPLOADS DE 1GB ──
    client_max_body_size 1024M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # ─── Cabeceras de Seguridad ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── WordPress Permalinks ───
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ─── PHP-FPM (El motor de WordPress) ───
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Buffers grandes para evitar errores 502 en uploads pesados y WP Admin
        fastcgi_buffer_size 128k;
        fastcgi_buffers 16 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Timeouts extendidos (crítico para subir 1GB en conexiones lentas)
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        # Pasar información del proxy (Coolify/Traefik maneja el SSL)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ─── Caché de Activos Estáticos (1 año) ───
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Seguridad: Bloqueo de archivos sensibles ───
    # Bloquear archivos ocultos (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Bloquear wp-config.php
    location ~ /wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Evitar ejecución de PHP en la carpeta de uploads (vulnerabilidad común)
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}