# ===================================================================
# Configuración Global de Nginx
# ===================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logs ───
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Rendimiento y Red ───
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Oculta la versión de Nginx por seguridad

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        text/javascript 
        image/svg+xml 
        application/vnd.ms-fontobject 
        application/x-font-ttf 
        font/opentype;
        # ─── FastCGI Cache (LA JOYA DE LA CORONA) ───
    # Zona de caché en memoria: 100MB para las claves
    # Almacén en disco: hasta 1GB de páginas cacheadas
    # Inactividad: 60 minutos sin acceso = se elimina
    fastcgi_cache_path /var/cache/nginx/fastcgi 
                       levels=1:2 
                       keys_zone=WORDPRESS:100m 
                       inactive=60m 
                       max_size=1G;
    
    # Clave única para cada página (scheme + method + host + URI)
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    
    # Servir caché antigua si PHP falla (tolerancia a errores)
    fastcgi_cache_use_stale error timeout invalid_header http_500;
    
    # Ignorar headers de WordPress que podrían romper la caché
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
    # ─── Incluir configuraciones de sitios ───
    include /etc/nginx/conf.d/*.conf;
}