; ===================================================================
; PHP.ini optimizado para WordPress de alto rendimiento
; Soporta: uploads 1GB, memoria 1GB, 20k visitas/día
; Compatible: PHP 7.4 → 8.5
; ===================================================================

[PHP]
; ─── Límites de memoria y ejecución ───
memory_limit         = 1024M
max_execution_time   = 600
max_input_time       = 600
max_input_vars       = 10000

; ─── Uploads de archivos grandes (1 GB) ───
upload_max_filesize  = 1024M
post_max_size        = 1100M
; post_max_size debe ser >= upload_max_filesize + overhead

; ─── Sesiones ───
session.save_handler = redis
session.save_path    = "tcp://redis:6379?auth=${REDIS_PASSWORD}"
session.gc_maxlifetime = 1440
session.cookie_httponly  = 1
session.cookie_secure    = 1
session.cookie_samesite  = "Lax"

; ─── Zona horaria ───
date.timezone = UTC

; ─── Exposición de errores (producción) ───
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /proc/self/fd/2
; En Docker, stderr se captura automáticamente

; ─── Realpath cache (mejora rendimiento en WP con muchos archivos) ───
realpath_cache_size  = 4096K
realpath_cache_ttl   = 600

; ─── Output buffering ───
output_buffering = 4096

; ─── Variables GET/POST/Request ───
variables_order    = "EGPCS"
request_order      = "GP"

; ─── Short tags (desactivado por seguridad) ───
short_open_tag = Off

; ─── Precision numérica ───
precision = 14

; ─── Expose PHP (desactivado en producción) ───
expose_php = Off

; ── Allow URL fopen (necesario para algunas APIs de WP) ───
allow_url_fopen  = On
allow_url_include = Off

; ─── Default charset ───
default_charset = "UTF-8"

; ─── Mail (desactivado, usar SMTP plugin) ───
SMTP = localhost
smtp_port = 25
sendmail_path = /usr/sbin/sendmail -t -i

; ─── Assert (producción) ───
zend.assertions = -1

; ─── OPCache (valores base, se sobreescriben en opcache.ini) ───
; Se recomienda mantener opcache.ini separado para claridad