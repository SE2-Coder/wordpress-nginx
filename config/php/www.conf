; ===================================================================
; Configuración del Pool PHP-FPM para 20k visitas/día
; ===================================================================

[www]
user = www-data
group = www-data

; Escuchar en el puerto 9000 (Docker networking)
listen = 9000

; --- Gestión de procesos (Dynamic es ideal para tráfico variable) ---
pm = dynamic

; pm.max_children: El límite absoluto de procesos simultáneos.
; Para 20k visitas/día, los picos suelen ser de 40-60 req/s. 
; 80 procesos nos dan un margen de seguridad enorme sin saturar la RAM.
pm.max_children = 80

; Procesos iniciales y de reserva
pm.start_servers = 12
pm.min_spare_servers = 6
pm.max_spare_servers = 20

; pm.max_requests: Reinicia el proceso después de X peticiones.
; Vital para evitar "fugas de memoria" (memory leaks) de plugins mal codificados.
pm.max_requests = 1000

; --- Timeouts (Deben coincidir con php.ini y Nginx) ---
; Si un upload de 1GB tarda 10 minutos, no queremos que PHP mate el proceso a los 5.
request_terminate_timeout = 600
pm.process_idle_timeout = 30s

; --- Logging y Monitorización ---
catch_workers_output = yes
decorate_workers_output = no

; Página de estado (Opcional, pero muy útil para monitorizar con New Relic/Datadog)
pm.status_path = /status
ping.path = /ping
ping.response = pong

; --- Variables de entorno (Seguridad) ---
clear_env = no