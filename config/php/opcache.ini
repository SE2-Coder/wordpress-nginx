; ===================================================================
; Configuración de OPcache para WordPress
; ===================================================================

[opcache]
opcache.enable = 1

; Memoria asignada para el código compilado. 
; WP Core + Plugins + Themes suelen ocupar entre 60MB y 150MB. 256MB es perfecto.
opcache.memory_consumption = 256

; Buffer para cadenas de texto internadas. 16MB es el estándar recomendado.
opcache.interned_strings_buffer = 16

; WP y sus plugins tienen muchísimos archivos. 20000 evita que se sature.
opcache.max_accelerated_files = 20000

; Frecuencia para comprobar si los archivos cambiaron (en segundos).
; 60s es ideal para producción. Si actualizas plugins vía Git/FTP, bájalo a 0 o 2.
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1

; Guardar comentarios (necesario para algunas librerías y DocBlocks de WP)
opcache.save_comments = 1

; Apagado rápido (Fast Shutdown) para liberar memoria al reiniciar PHP-FPM
opcache.fast_shutdown = 1

; --- JIT (Just-In-Time Compiler) - Exclusivo PHP 8.0+ ---
; Asigna 128MB para compilar código a nivel de CPU en tiempo real.
opcache.jit_buffer_size = 128M
opcache.jit = tracing